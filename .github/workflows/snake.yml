name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake from contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1D285E&color_dots=#EEF0F6,#E9D3E8,#D3A8D1,#AF6DAB,#7B3F78&color_dot_border=#DDDFEA
            dist/snake-dark.svg?color_snake=#F2A07B&color_dots=#232842,#4A3A5C,#7A4F7C,#AF6DAB,#D9A3D6&color_dot_border=#2F3556

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
